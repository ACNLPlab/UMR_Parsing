name: BiBLg_0r_0
model: facebook/bart-large

# <--------------
# Linearizations
# Comment DFS and uncomment the relevant block if you want to use a different linearization scheme

# DFS
penman_linearization: True
use_pointer_tokens: True
raw_graph: False

seeds: 2022

remove_wiki: False
dereify: False
collapse_name_ops: False

# Hparams
batch_size: 500
beam_size: 3
dropout: 0.25
attention_dropout: 0.05
smart_init: True
accum_steps: 10
warmup_steps: 1
training_steps: 50000
weight_decay: 0.004
grad_norm: 2.5
scheduler: constant
learning_rate: 0.00004
max_epochs: 10
save_checkpoints: True
log_wandb: False
warm_start: True
use_recategorization: False
best_loss: False
remove_longer_than: 5000

# generation task
use_lm_loss: False
lm_loss_weight: 1.0
# reconstruction task
use_mask_loss: False
mask_loss_weight: 0.5

recap: False
recap_ratio: 0.2
recap_weight: 0.5
gen_max_len: 5000
gen_beam_size: 3
amr_mask_ratio: 0.5
nl_mask_ratio: 0.5

# <------------------
# Data: replace DATA below with the root of your AMR 2/3 release folder
train: /home/common/ACNLP/umr_parsing/umr2_data/train/sent/umr2-eng-train-bibl.txt
dev: /home/common/ACNLP/umr_parsing/umr2_data/train/sent/umr2-eng-dev-bibl.txt
test: /home/common/ACNLP/umr_parsing/umr2_data/train/sent/umr2-eng-test-bibl.txt

# remember to create correpsonding tmp folders
dev_gold: data/tmp/dev-gold_sent_umr2.txt
dev_pred: data/tmp/dev-pred_sent_umr2.txt
